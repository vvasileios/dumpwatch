services:
    db:
        image: postgis/postgis:18-3.6
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-dumpwatch}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dumpwatch}
            POSTGRES_DB: ${POSTGRES_DB:-dumpwatch}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql
            - ./db/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            start_period: 30s
            start_interval: 1s
            retries: 10

    app:
        build: .
        init: true
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-dumpwatch}:${POSTGRES_PASSWORD:-dumpwatch}@db:5432/${POSTGRES_DB:-dumpwatch}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
            ADMIN_EMAIL: ${ADMIN_EMAIL:-}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
        ports:
            - "127.0.0.1:3000:3000"
            - "127.0.0.1:9229:9229"
        volumes:
            - .:/app
            - node_modules:/app/node_modules
        depends_on:
            db:
                condition: service_healthy

volumes:
    pgdata:
    node_modules:
