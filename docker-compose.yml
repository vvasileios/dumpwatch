services:
    db:
        image: postgis/postgis:18-3.6
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-dumpwatch}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dumpwatch}
            POSTGRES_DB: ${POSTGRES_DB:-dumpwatch}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 5s
            start_period: 30s
            start_interval: 1s
            retries: 10

    migrate:
        image: ghcr.io/amacneil/dbmate:2.36.0
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER:-dumpwatch}:${POSTGRES_PASSWORD:-dumpwatch}@db:5432/${POSTGRES_DB:-dumpwatch}?sslmode=disable
            DBMATE_MIGRATIONS_DIR: /db/migrations
            DBMATE_SCHEMA_FILE: /db/schema.sql
        volumes:
            - ./db:/db
        command: ["--wait", "up"]
        depends_on:
            db:
                condition: service_healthy

    app:
        build: .
        init: true
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-dumpwatch}:${POSTGRES_PASSWORD:-dumpwatch}@db:5432/${POSTGRES_DB:-dumpwatch}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
            ADMIN_EMAIL: ${ADMIN_EMAIL:-}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
        ports:
            - "127.0.0.1:3000:3000"
            - "127.0.0.1:9229:9229"
        volumes:
            - .:/app
            - node_modules:/app/node_modules
        depends_on:
            migrate:
                condition: service_completed_successfully

    migrate-test:
        image: ghcr.io/amacneil/dbmate:2.36.0
        profiles: ["test"]
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER:-dumpwatch}:${POSTGRES_PASSWORD:-dumpwatch}@db:5432/dumpwatch_test?sslmode=disable
            DBMATE_MIGRATIONS_DIR: /db/migrations
            DBMATE_NO_DUMP_SCHEMA: "true"
        volumes:
            - ./db:/db:ro
        entrypoint: ["sh", "-c", "dbmate --wait drop; dbmate up"]
        depends_on:
            db:
                condition: service_healthy

    test:
        build: .
        profiles: ["test"]
        init: true
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-dumpwatch}:${POSTGRES_PASSWORD:-dumpwatch}@db:5432/dumpwatch_test
            BETTER_AUTH_SECRET: test-secret-only-for-the-test-suite-0123456789
            BETTER_AUTH_URL: http://127.0.0.1:3001
            ADMIN_EMAIL: admin@test.local
            ADMIN_PASSWORD: test-admin-password
            NUXT_PUBLIC_DEMO_TOOLS: "true"
            NODE_ENV: production
            HOST: 127.0.0.1
            PORT: "3001"
        volumes:
            - .:/app
            - node_modules:/app/node_modules
        tmpfs:
            - /app/.nuxt:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}
        command: ["sh", "tests/run.sh"]
        depends_on:
            migrate-test:
                condition: service_completed_successfully

volumes:
    pgdata:
    node_modules:
