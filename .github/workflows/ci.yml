name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - name: Configure environment
              run: |
                  sed "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" .env.example > .env
                  echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
                  echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

            - name: Start database
              run: docker compose up -d --wait db

            - name: Install dependencies
              run: docker compose run --rm --no-deps app npm ci --no-audit --no-fund

            - name: Typecheck
              run: docker compose run --rm --no-deps app npx nuxt typecheck

            - name: API tests
              run: make test
